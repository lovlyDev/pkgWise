name: Bug report
description: Report reproducible incorrect behavior in PkgWise
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not disclose security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: PkgWise version
      placeholder: 0.1.0-alpha.2
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Node.js version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove secrets, private package names, and proprietary lockfile content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
