name: Publish alpha

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact synchronized alpha version to publish
        required: true
        type: string

concurrency:
  group: publish-alpha
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.16.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate requested version
        run: pnpm release:version ${{ inputs.version }}
      - run: pnpm release:check
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-${{ inputs.version }}
          path: .artifacts/*.tgz
          if-no-files-found: error
      - name: Publish core
        run: npm publish .artifacts/pkgwise-core-*.tgz --tag next --access public --provenance
      - name: Publish CLI
        run: npm publish .artifacts/pkgwise-[0-9]*.tgz --tag next --access public --provenance
